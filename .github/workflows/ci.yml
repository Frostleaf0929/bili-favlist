name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall src
      - name: Boot demo mode and probe API
        run: |
          python src/main.py app --demo --port 8799 &
          sleep 4
          curl -sf http://127.0.0.1:8799/api/overview | tee /dev/stderr | grep -q '"total"'
          curl -sf "http://127.0.0.1:8799/api/items?page_size=5" >/dev/null
          curl -sf http://127.0.0.1:8799/api/taxonomy >/dev/null
          curl -sf http://127.0.0.1:8799/ | grep -q "分类工作台"
          kill %1
